[package]
name = "bctl"
description = "browserctl: run, watch, and automate browser appliances"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bctl"
path = "src/main.rs"

[dependencies]
bctl-automation = { path = "../automation" }
bctl-cdp = { path = "../cdp" }
bctl-core = { path = "../core" }
bctl-jobs = { path = "../jobs" }
bctl-rfb = { path = "../rfb" }
async-lock = "3"
async-net = { package = "laputa-async-net", version = "0.3" }
bytes = "1"
futures-lite = { package = "laputa-futures-lite", version = "0.3", default-features = false, features = ["std"] }
h12tiny = { version = "0.9", default-features = false, features = ["server", "http1", "web", "websocket"] }
http = "1"
bctl-runtime = { path = "../runtime" }
bctl-runtime-nanos = { path = "../runtime-nanos" }
bctl-runtime-smolvm = { path = "../runtime-smolvm" }
lexopt = "0.3"
miniserde = "0.1"
rustix = { version = "1", features = ["process"] }
sha2 = "0.11"

[lints]
workspace = true

[dev-dependencies]
shadowdriver = { git = "https://github.com/joshuarli/shadowdriver", rev = "b69409e3034a478b0e8a3703e6dee84332eec90c" }
async-io = "2"
