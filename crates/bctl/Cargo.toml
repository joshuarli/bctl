[package]
name = "bctl"
description = "browserctl: run, watch, and automate browser appliances"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bctl"
path = "src/main.rs"

[dependencies]
bctl-automation = { path = "../automation" }
bctl-cdp = { path = "../cdp" }
bctl-core = { path = "../core" }
bctl-jobs = { path = "../jobs" }
bctl-rfb = { path = "../rfb" }
async-lock = "3"
async-net = { package = "laputa-async-net", version = "0.3" }
bytes = "1"
futures-lite = { package = "laputa-futures-lite", version = "0.3", default-features = false, features = ["std"] }
h12tiny = { version = "0.9", default-features = false, features = ["server", "http1", "web", "websocket", "client-sync", "tls"] }
rawzip = { git = "https://github.com/laputa-systems/rawzip", rev = "35162d1668a8b97cefc782143e506e2c087b0b91" }
zlib-rs = { git = "https://github.com/laputa-systems/zlib-rs", rev = "31a9badb3198ec413d45e07ce8e46d5f5f6ef1c5" }
http = "1"
bctl-runtime = { path = "../runtime" }
bctl-runtime-nanos = { path = "../runtime-nanos" }
bctl-runtime-smolvm = { path = "../runtime-smolvm" }
lexopt = "0.3"
miniserde = "0.1"
rustix = { version = "1", features = ["process"] }
sha2 = "0.11"

[lints]
workspace = true

[dev-dependencies]
shadowdriver = { git = "https://github.com/joshuarli/shadowdriver", rev = "b1e7b18d3a1f390eb0c56be0f29013687a19dcec" }
async-io = "2"
