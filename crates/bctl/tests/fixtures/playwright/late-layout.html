<!doctype html>
<title>Late layout</title>
<style>
  body { margin: 0 }
  button { display: block; width: 200px; height: 20px; border: 0; margin: 0 0 10px 0 }
  #moving { transition: margin-left 500ms linear }
</style>
<button id=moving>Moving</button>
<button id=shown style="display: none">Shown</button>
<button id=revealed style="visibility: hidden">Revealed</button>
<div id=parent style="display: none"><button id=nested>Nested</button></div>
<button id=enabled disabled><span id=label>Enabled later</span></button>
<script>
const seenKey = window === top ? "seen" : "seen " + location.pathname;
window.seen = JSON.parse(sessionStorage.getItem(seenKey) || "[]");
function note(what, on, trusted = true) {
  seen.push({ what, on, trusted, page: location.pathname + location.search, at: Math.round(performance.now()) });
  sessionStorage.setItem(seenKey, JSON.stringify(seen));
}
for (const type of ["mousedown", "mouseup", "click"]) {
  addEventListener(type, event => note(type, event.target.id || event.target.localName, event.isTrusted), true);
}
</script>
<script>
const changes = {
  moving: () => document.getElementById("moving").style.marginLeft = "200px",
  shown: () => document.getElementById("shown").style.display = "block",
  revealed: () => document.getElementById("revealed").style.visibility = "visible",
  nested: () => document.getElementById("parent").style.display = "block",
  enabled: () => document.getElementById("enabled").disabled = false,
};
function arm(id, after) {
  note("armed", id);
  setTimeout(() => { changes[id](); note("ready", id); }, after);
  return "armed";
}
document.getElementById("moving").addEventListener("click", event => note("left", String(event.target.getBoundingClientRect().left)));
</script>
