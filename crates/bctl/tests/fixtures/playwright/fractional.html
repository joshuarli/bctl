<!doctype html>
<title>Fractional</title>
<style>
  body { margin: 0 }
  .cell { position: absolute; top: 0; width: 60px; height: 40px }
  .dot { width: 1px; height: 1px; background: black }
  .zoomed { position: absolute; top: 60px; left: 0; zoom: 1.37 }
</style>
<div class=cell style="left: 0"><div class=dot id=aligned></div></div>
<div class=cell style="left: 60px"><div class=dot id=half style="margin-left: 20.5px; margin-top: 11.5px"></div></div>
<div class=cell style="left: 120px"><div class=dot id=v1 style="margin-left: 20.23px; margin-top: 11.65px"></div></div>
<div class=cell style="left: 180px"><div class=dot id=v2 style="margin-left: 20.68px; margin-top: 11.13px"></div></div>
<div class=cell style="left: 240px"><div class=dot id=v3 style="margin-left: 20.68px; margin-top: 11.52px"></div></div>
<div class=cell style="left: 300px"><div class=dot id=v4 style="margin-left: 20.15px; margin-top: 11.24px"></div></div>
<div class=zoomed>
  <div class=cell style="left: 0"><div class=dot id=zoomed-v1 style="margin-left: 20.23px; margin-top: 11.65px"></div></div>
  <div class=cell style="left: 60px"><div class=dot id=zoomed-v4 style="margin-left: 20.15px; margin-top: 11.24px"></div></div>
</div>
<script>
const seenKey = window === top ? "seen" : "seen " + location.pathname;
window.seen = JSON.parse(sessionStorage.getItem(seenKey) || "[]");
function note(what, on, trusted = true) {
  seen.push({ what, on, trusted, page: location.pathname + location.search, at: Math.round(performance.now()) });
  sessionStorage.setItem(seenKey, JSON.stringify(seen));
}
for (const type of ["mousedown", "mouseup", "click"]) {
  addEventListener(type, event => note(type, event.target.id || event.target.localName, event.isTrusted), true);
}
</script>
