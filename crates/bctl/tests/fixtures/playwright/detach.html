<!doctype html>
<title>Detach</title>
<style>
  body { margin: 0 }
  @keyframes move { from { margin-left: 0 } to { margin-left: 100px } }
  .moving { animation: 3s linear infinite move }
  button { display: block }
  iframe { display: block; width: 300px; height: 120px; border: 0 }
</style>
<div id=stage></div>
<iframe id=frame src="/playwright/frame"></iframe>
<script>
const seenKey = window === top ? "seen" : "seen " + location.pathname;
window.seen = JSON.parse(sessionStorage.getItem(seenKey) || "[]");
function note(what, on, trusted = true) {
  seen.push({ what, on, trusted, page: location.pathname + location.search, at: Math.round(performance.now()) });
  sessionStorage.setItem(seenKey, JSON.stringify(seen));
}
for (const type of ["mousedown", "mouseup", "click"]) {
  addEventListener(type, event => note(type, event.target.id || event.target.localName, event.isTrusted), true);
}
</script>
<script>
let made = 0;
const stage = document.getElementById("stage");
function addButton() {
  const button = document.createElement("button");
  button.id = "b" + ++made;
  button.textContent = "Click me";
  button.className = "moving";
  stage.appendChild(button);
  return button.id;
}
function stopButton(remove) {
  const button = stage.querySelector("button");
  button.style.marginLeft = button.getBoundingClientRect().left + "px";
  button.className = "";
  if (remove) button.remove();
  return button.id;
}
function later(after, change) {
  setTimeout(() => note(...change()), after);
  return "armed";
}
const removeLater = after => later(after, () => ["removed", stopButton(true)]);
const churnLater = step => {
  later(step, () => { stopButton(true); return ["replaced", addButton()]; });
  later(2 * step, () => { stopButton(true); return ["replaced", addButton()]; });
  return later(3 * step, () => ["ready", stopButton(false)]);
};
const adoptLater = after => later(after, () => {
  const button = stage.querySelector("button");
  document.getElementById("frame").contentDocument.body.appendChild(button);
  return ["moved", button.id];
});
const dropFrameLater = after => later(after, () => { document.getElementById("frame").remove(); return ["frame removed", "frame"]; });
</script>
